name: code-mode-compiled-acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/code-mode-compiled-acceptance.yml
      - bun.lock
      - package.json
      - packages/cli/src/bootstrap.ts
      - packages/cli/src/main.ts
      - packages/cli/src/standalone.ts
      - packages/coding-agent/package.json
      - packages/coding-agent/src/code-mode/**
      - scripts/build-release.ts
      - scripts/code-mode-acceptance.ts
      - scripts/compile-zi.ts

concurrency:
  group: code-mode-compiled-acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: windows-2022
            target: windows-x64
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build and exercise code mode in the release executable
        env:
          ZI_RELEASE_VERSION: 0.0.0-acceptance
          ZI_RELEASE_TARGET: ${{ matrix.target }}
        run: bun scripts/build-release.ts
