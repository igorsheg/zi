name: code-mode-sandbox-prototype

# PROTOTYPE: delete with scripts/code-mode-sandbox-prototype.ts after the sandbox decision lands.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/code-mode-sandbox-prototype.yml
      - bun.lock
      - package.json
      - scripts/code-mode-sandbox-prototype.ts
      - scripts/compile-zi.ts

concurrency:
  group: code-mode-sandbox-prototype-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: windows-2022
            target: windows-x64
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run probe:code-mode-sandbox
