name: Deploy website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  WEBSITE_ZIG_VERSION: 0.16.0
  WEBSITE_ZINE_VERSION: v0.11.2
  CLOUDFLARE_PAGES_PROJECT: withzi
  WEBSITE_OUT_DIR: zig-out/web

jobs:
  deploy:
    name: Build and deploy website
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup website Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.WEBSITE_ZIG_VERSION }}

      - name: Setup Zine
        uses: kristoff-it/setup-zine@v1
        with:
          version: ${{ env.WEBSITE_ZINE_VERSION }}

      - name: Build website
        working-directory: website
        run: zig build web -p ../${{ env.WEBSITE_OUT_DIR }}

      - name: Verify Cloudflare secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy ${{ env.WEBSITE_OUT_DIR }}
            --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
            --commit-dirty=true
