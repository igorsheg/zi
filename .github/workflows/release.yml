name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build and smoke-test native executable
        env:
          ZI_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && '0.0.0-acceptance' || github.ref_name }}
          ZI_RELEASE_TARGET: ${{ matrix.target }}
        run: bun scripts/build-release.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 1

  npm-package:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Build npm package tarballs
        env:
          ZI_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && '0.0.0-acceptance' || github.ref_name }}
        run: bun scripts/build-npm-packages.ts --pack --verify-current
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-packages
          path: dist/npm/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: [build, npm-package]
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify and combine checksums
        run: |
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 5
          cd dist
          sha256sum --check ./*.sha256
          cat -- ./*.sha256 | sort -k2 > SHA256SUMS
          rm -- *.sha256
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --generate-notes --title "Zi $TAG" "${flags[@]}"

  publish-npm:
    needs: [publish, npm-package]
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/@with-zi/zi
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # Trusted publishing requires Node 22.14+ and npm 11.5.1+ for OIDC authentication.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-packages
          path: dist/npm
      - name: Publish npm packages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          publish() {
            package="$1"
            tarball="$2"
            if npm view "${package}@${version}" version >/dev/null 2>&1; then
              echo "${package}@${version} is already published"
              return
            fi
            npm publish "$tarball" --access public --provenance --tag latest
          }

          # Prove trusted publishing for the newest package before publishing the native set.
          publish "@with-zi/extension-api" "dist/npm/with-zi-extension-api-${version}.tgz"

          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 windows-x64; do
            publish "@with-zi/zi-${target}" "dist/npm/with-zi-zi-${target}-${version}.tgz"
          done

          publish "@with-zi/zi" "dist/npm/with-zi-zi-${version}.tgz"
