name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build without leading v, e.g. 0.1.0-rc.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.dist_target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            zig_target: x86_64-linux-musl
            dist_target: x86_64-unknown-linux-musl
            archive_kind: tar.gz
          - os: ubuntu-latest
            zig_target: aarch64-linux-musl
            dist_target: aarch64-unknown-linux-musl
            archive_kind: tar.gz
          - os: macos-14
            zig_target: native
            dist_target: aarch64-apple-darwin
            archive_kind: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: extensions/host/package-lock.json

      - name: Install extension host dependencies
        run: npm --prefix extensions/host ci

      - name: Derive version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            if [[ "$version" == v* ]]; then
              echo "manual version must not include leading v: $version" >&2
              exit 2
            fi
          else
            tag="${GITHUB_REF_NAME}"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "invalid release tag: $tag" >&2
              echo "expected vX.Y.Z, optionally with prerelease/build metadata" >&2
              exit 2
            fi
            version="${tag#v}"
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"

      - name: Build zi
        shell: bash
        run: |
          args=(-Doptimize=ReleaseSafe -Dstrip=true -Dversion="$VERSION")
          if [ "${{ matrix.zig_target }}" != "native" ]; then
            args+=("-Dtarget=${{ matrix.zig_target }}")
          fi
          zig build "${args[@]}"

      - name: Package artifact
        shell: bash
        run: |
          ./scripts/package-release.sh \
            "$VERSION" \
            "${{ matrix.dist_target }}" \
            "${{ matrix.archive_kind }}"

      - name: Validate archive
        shell: bash
        run: |
          archive="dist/zi-v$VERSION-${{ matrix.dist_target }}.${{ matrix.archive_kind }}"
          case "$archive" in
            *.tar.gz) tar -tzf "$archive" >/dev/null ;;
            *.zip) unzip -tq "$archive" >/dev/null ;;
            *) echo "unknown archive kind: $archive" >&2; exit 1 ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zi-v${{ env.VERSION }}-${{ matrix.dist_target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release-candidate:
    name: Assemble release candidate artifacts
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        working-directory: dist
        run: |
          ../scripts/checksums.sh zi-v* > checksums.txt
          cat checksums.txt

      - name: Upload release candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: zi-release-candidate-v${{ inputs.version }}
          path: |
            dist/zi-v*
            dist/checksums.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        working-directory: dist
        run: |
          ../scripts/checksums.sh zi-v* > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ env.PRERELEASE }}
          files: |
            dist/zi-v*
            dist/checksums.txt
