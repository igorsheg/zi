name: subagent-compiled-acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/subagent-compiled-acceptance.yml
      - bun.lock
      - package.json
      - packages/cli/src/**
      - packages/coding-agent/src/agent-session.ts
      - packages/coding-agent/src/runtime-options.ts
      - packages/coding-agent/src/runtime.ts
      - packages/coding-agent/src/session-shell.ts
      - packages/coding-agent/src/sdk.ts
      - packages/coding-agent/src/session-manager.ts
      - packages/coding-agent/src/settings-manager.ts
      - packages/coding-agent/src/subagents/**
      - packages/coding-agent/src/rpc/**
      - packages/coding-agent/src/tools/bash.ts
      - packages/coding-agent/src/extensions/**
      - packages/extension-api/**
      - scripts/build-release.ts
      - scripts/compile-zi.ts
      - scripts/subagent-compiled-acceptance.ts

concurrency:
  group: subagent-compiled-acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: windows-2022
            target: windows-x64
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build and exercise native subagents in the release executable
        env:
          ZI_RELEASE_VERSION: 0.0.0-subagent-acceptance
          ZI_RELEASE_TARGET: ${{ matrix.target }}
        run: bun scripts/build-release.ts
