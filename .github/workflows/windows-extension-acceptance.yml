name: windows-extension-acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-extension-acceptance.yml"
      - "bun.lock"
      - "package.json"
      - "scripts/build-release.ts"
      - "scripts/compile-zi.ts"
      - "scripts/extension-custom-tool-acceptance.ts"
      - "examples/extensions/custom-tool/**"
      - "examples/extensions/durable-counter/**"
      - "examples/rpc/**"
      - "packages/cli/**"
      - "packages/coding-agent/src/agent-session*.ts"
      - "packages/coding-agent/src/code-mode/**"
      - "packages/coding-agent/src/extensions/**"
      - "packages/coding-agent/src/processes/**"
      - "packages/coding-agent/src/rpc/**"
      - "packages/coding-agent/src/subagents/**"
      - "packages/extension-api/**"
      - "packages/tui/src/interactive/**"

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build and accept the compiled Windows extension path
        env:
          ZI_RELEASE_VERSION: 0.0.0-windows-acceptance
          ZI_RELEASE_TARGET: windows-x64
        run: bun scripts/build-release.ts
